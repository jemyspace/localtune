[build]
  base = "app"
  command = "npm ci && npm run build"
  publish = "dist"
  functions = "../netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # Paths are relative to [build].base ("app")
  included_files = ["server/**"]

[functions.research]
  timeout = 26
  included_files = ["server/musicbrainz.mjs"]

[[redirects]]
  from = "/api/research"
  to = "/.netlify/functions/research"
  status = 200

[[redirects]]
  from = "/api/acoustid"
  to = "/.netlify/functions/acoustid"
  status = 200
